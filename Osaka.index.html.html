<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大阪四日小旅行</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
:root{--bg:#FFFCF6;--ink:#3E3A39;--pink:#F2A497;--yel:#F6D27A;--blue:#A8D3E6;--grn:#B9DAA5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:calc(70px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Huninn','Noto Sans TC',sans-serif;line-height:1.6;max-width:640px;margin-inline:auto;padding:0 14px 60px}
nav{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--bg);border-bottom:3px solid var(--ink);padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;display:flex;gap:6px;justify-content:center;overflow-x:auto}
nav a{color:var(--ink);text-decoration:none;border:3px solid var(--ink);border-radius:20px;padding:2px 12px;font-size:14px;white-space:nowrap;background:var(--yel)}
nav a:nth-child(2){background:var(--blue)}nav a:nth-child(3){background:var(--grn)}nav a:nth-child(4){background:var(--pink)}
main{padding-top:calc(64px + env(safe-area-inset-top,0px))}
section{margin-top:26px}
h1,h2{margin:0}h2{font-size:22px;margin-bottom:10px}
.card{border:3px solid var(--ink);border-radius:24px;padding:14px;background:#fff}
.hero{text-align:center;background:var(--blue);overflow:hidden;padding:10px 14px 18px}
.hero h1{font-size:28px;margin-top:4px}
.hero p{margin:2px 0 10px}
.cd{display:inline-flex;gap:8px}
.cd div{background:var(--bg);border:3px solid var(--ink);border-radius:16px;padding:2px 10px;min-width:62px}
.cd b{font-size:24px;display:block;line-height:1.2}.cd span{font-size:12px}
.flights{display:grid;gap:12px}
.fl{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fl .t{font-size:24px}.fl small{display:block;font-size:12px}
.badge{border:3px solid var(--ink);border-radius:14px;padding:0 10px;font-size:13px;background:var(--yel);display:inline-block}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}
.days button{font:inherit;color:var(--ink);background:var(--bg);border:3px solid var(--ink);border-radius:20px;padding:4px 14px;cursor:pointer;flex:0 0 auto;text-align:center;line-height:1.3}
.days button small{display:block;font-size:11px}
.days button.on{background:var(--pink);transform:translateY(-2px)}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:translateY(18px) scale(.95);opacity:0}100%{transform:none;opacity:1}}
.tl{position:relative;margin:6px 0 0 8px;padding-left:22px;border-left:3px dashed var(--ink)}
.it{position:relative;margin-bottom:12px}
.it::before{content:"";position:absolute;left:-32px;top:14px;width:16px;height:16px;border-radius:50%;background:var(--yel);border:3px solid var(--ink)}
.it.must::before{background:var(--pink)}
.it .tm{font-size:13px}
.tag{border:2px solid var(--ink);border-radius:12px;padding:0 8px;font-size:12px;margin-right:4px;display:inline-block}
.t-電車{background:var(--blue)}.t-步行{background:var(--grn)}.t-計程車{background:var(--yel)}.t-飛機{background:#fff}.t-用餐{background:var(--pink)}.t-購物{background:#F6D27A}.t-休息{background:#E9E4DA}
.must-b{background:var(--pink);border:2px solid var(--ink);border-radius:12px;padding:0 8px;font-size:12px}
.ck{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ck li{display:flex;align-items:center;gap:10px;border:3px solid var(--ink);border-radius:18px;padding:6px 12px;background:var(--bg)}
.ck li.done{background:var(--grn)}.ck li.done .lb{text-decoration:line-through}
.ck input[type=checkbox]{appearance:none;width:26px;height:26px;border:3px solid var(--ink);border-radius:9px;background:#fff;flex:none;margin:0;cursor:pointer}
.ck input:checked{background:var(--yel)}
.ck input:checked::after{content:"✓";display:block;text-align:center;line-height:20px;font-size:18px}
.lb{flex:1}
.prog{font-size:14px;margin-bottom:8px}
.bar{height:16px;border:3px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--grn);width:0;transition:width .4s}
.hotel p{margin:4px 0}
a.tel{color:var(--ink)}
button.act,.ed input,.ed select,.add input{font:inherit;color:var(--ink);border:3px solid var(--ink);border-radius:14px;background:#fff;padding:2px 8px}
button.act{background:var(--yel);cursor:pointer;padding:3px 14px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.ed .row input[data-f=time]{width:84px}.ed .row input[data-f=text]{flex:1;min-width:120px}
.x{background:var(--pink)!important;padding:0 10px!important}
.add{display:flex;gap:6px;margin-top:10px}.add input{flex:1;min-width:0}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;font:inherit;color:var(--ink);background:var(--grn);border:3px solid var(--ink);border-radius:26px;padding:8px 18px;cursor:pointer}
.fab.on{background:var(--pink)}
svg .float{animation:fl 4s ease-in-out infinite}
svg .drift{animation:dr 18s linear infinite}
svg .train{animation:tr 9s linear infinite}
svg .sun{animation:sp 3s ease-in-out infinite;transform-origin:50px 40px}
@keyframes fl{50%{transform:translateY(-5px)}}
@keyframes dr{from{transform:translateX(-60px)}to{transform:translateX(360px)}}
@keyframes tr{from{transform:translateX(-110px)}to{transform:translateX(340px)}}
@keyframes sp{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<nav><a href="#top">首頁</a><a href="#flight">航班</a><a href="#plan">行程</a><a href="#todo">清單</a></nav>
<main id="top">
<section class="card hero" style="margin-top:0">
<svg viewBox="0 0 320 170" width="100%" role="img" aria-label="大阪城與電車插圖" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round">
<g class="sun"><circle cx="50" cy="40" r="20" fill="#F6D27A"/></g>
<g class="drift"><path d="M0 50h50a12 12 0 0 0-8-18 16 16 0 0 0-30 4A10 10 0 0 0 0 50z" fill="#FFFCF6"/></g>
<path d="M0 150h320v20H0z" fill="#B9DAA5"/>
<g class="float"><rect x="120" y="108" width="100" height="42" rx="4" fill="#FFFCF6"/><path d="M130 108l40-24 40 24z" fill="#F2A497"/><rect x="140" y="80" width="60" height="20" fill="#FFFCF6"/><path d="M134 80l36-24 36 24z" fill="#F2A497"/><rect x="152" y="58" width="36" height="14" fill="#FFFCF6"/><path d="M146 58l24-18 24 18z" fill="#F2A497"/><path d="M170 40v-10" /><circle cx="170" cy="27" r="4" fill="#F6D27A"/><rect x="162" y="124" width="16" height="26" rx="8" fill="#A8D3E6"/></g>
<g class="train"><rect x="0" y="124" width="84" height="24" rx="10" fill="#FFFCF6"/><rect x="8" y="130" width="14" height="9" rx="3" fill="#A8D3E6"/><rect x="28" y="130" width="14" height="9" rx="3" fill="#A8D3E6"/><rect x="48" y="130" width="14" height="9" rx="3" fill="#A8D3E6"/><path d="M0 138h84" stroke="#F2A497"/><circle cx="20" cy="150" r="5" fill="#F6D27A"/><circle cx="64" cy="150" r="5" fill="#F6D27A"/></g>
<g fill="#F2A497"><circle cx="265" cy="128" r="14"/><circle cx="283" cy="134" r="11"/><circle cx="252" cy="138" r="10"/><path d="M268 140v10" fill="none"/></g>
</svg>
<h1>大阪四日小旅行</h1>
<p>12/08 – 12/11 ・ 逛街買買買</p>
<div class="cd" id="cd" aria-live="polite"></div>
</section>

<section id="flight"><h2>✈ 航班</h2><div class="flights">
<div class="card" style="background:var(--blue)"><span class="badge">去程 ・ 12/08</span><div class="fl"><div><div class="t">06:55</div><small>高雄 KHH</small></div><div style="text-align:center">✈<small>虎航 IT284</small></div><div style="text-align:right"><div class="t">10:40</div><small>關西 KIX</small></div></div><small>托運行李 20KG</small></div>
<div class="card" style="background:var(--yel)"><span class="badge" style="background:#fff">回程 ・ 12/11</span><div class="fl"><div><div class="t">11:30</div><small>關西 KIX</small></div><div style="text-align:center">✈<small>虎航 IT285</small></div><div style="text-align:right"><div class="t">14:00</div><small>高雄 KHH</small></div></div><small>托運行李 25KG</small></div>
</div></section>

<section id="plan"><h2>🗓 每日行程</h2>
<div class="days" id="days"></div>
<div class="card" id="tl"></div>
<div class="card hotel" style="margin-top:12px;background:var(--grn)"><b>🏨 大阪心齋橋東方快捷酒店</b>
<p>📍 日本大阪市中央區南船場3-2-13</p>
<p>📞 <a class="tel" href="tel:+81662438111">+81 6-6243-8111</a></p>
<p>入住 15:00 後 ・ 退房 11:00 前</p></div>
</section>

<section id="todo"><h2>🛍 必逛品牌</h2><div class="card"><div id="brands"></div></div>
<h2 style="margin-top:22px">📝 待辦清單</h2><div class="card"><div id="todos"></div></div></section>
<p style="text-align:center;font-size:12px">時間為預估，可點右下角「編輯」自行調整 ✿</p>
</main>
<button class="fab" id="fab">✎ 編輯</button>

<script>
const KEY='osaka-trip-v1';
const T=['電車','步行','計程車','飛機','用餐','購物','休息'];
const def={cur:0,edit:false,
days:[
{d:'12/08',w:'二',items:[
{t:'06:55',x:'高雄機場起飛，前往關西機場',g:'飛機'},
{t:'10:40',x:'抵達關西機場，搭南海電鐵到道頓堀',g:'電車'},
{t:'12:00',x:'到住宿放行李（15:00 後才能入住）',g:'步行'},
{t:'12:30',x:'心齋橋商店街午餐',g:'用餐'},
{t:'14:00',x:'千日前商店街：買刀具、碗盤',g:'購物',m:1},
{t:'16:30',x:'回心齋橋商店街繼續買',g:'購物'},
{t:'19:00',x:'返回住宿休息',g:'休息'}]},
{d:'12/09',w:'三',items:[
{t:'08:30',x:'步行到心齋橋站，搭御堂筋線（往箕面萱野），免換車到終點站',g:'電車'},
{t:'09:45',x:'箕面萱野站轉搭計程車',g:'計程車'},
{t:'10:15',x:'勝尾寺：蒐集明信片、買御守與達摩',g:'購物',m:1},
{t:'13:00',x:'返回心齋橋商店街午餐',g:'用餐'},
{t:'14:30',x:'逛街、唐吉軻德',g:'購物'},
{t:'18:30',x:'心齋橋商店街晚餐',g:'用餐'},
{t:'20:00',x:'返回住宿休息',g:'休息'}]},
{d:'12/10',w:'四',items:[
{t:'08:30',x:'木津市場吃早餐、海鮮丼飯',g:'用餐',m:1},
{t:'10:30',x:'前往梅田百貨公司購物',g:'購物'},
{t:'12:30',x:'梅田午餐',g:'用餐'},
{t:'17:00',x:'天滿地區體驗居酒屋文化',g:'用餐',m:1},
{t:'20:30',x:'返回心齋橋住宿休息',g:'休息'}]},
{d:'12/11',w:'五',items:[
{t:'08:00',x:'確認有無物品未購買，最後補貨',g:'購物'},
{t:'09:00',x:'退房（11:00 前）',g:'休息'},
{t:'09:15',x:'搭御堂筋線到難波站，轉乘南海電鐵返回關西空港',g:'電車'},
{t:'11:30',x:'虎航 IT285 起飛，14:00 抵達高雄',g:'飛機',m:1}]}],
brands:['BEAMS','Montbell','Porter','3coins','Uniqlo','迪士尼商店','三麗鷗','任天堂商店'].map(t=>({t,c:0})),
todos:['刀具、碗盤（千日前）','勝尾寺明信片、御守、達摩','唐吉軻德補貨','確認回程行李不超過 25KG'].map(t=>({t,c:0}))};
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.days)S=JSON.parse(JSON.stringify(def));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function days(){
 $('days').innerHTML=S.days.map((d,i)=>`<button class="${i==S.cur?'on':''}" data-day="${i}">Day ${i+1}<small>${esc(d.d)}（${esc(d.w)}）</small></button>`).join('');
}
function tl(pop){
 const D=S.days[S.cur],el=$('tl');
 if(S.edit){
  el.className='card ed';
  el.innerHTML=D.items.map((it,i)=>`<div class="row" data-i="${i}"><input data-f="time" value="${esc(it.t)}" aria-label="時間"><select data-f="tag">${T.map(g=>`<option${g==it.g?' selected':''}>${g}</option>`).join('')}</select><label><input type="checkbox" data-f="must"${it.m?' checked':''}> 必去</label><button class="act x" data-del="${i}" aria-label="刪除">✕</button><input data-f="text" value="${esc(it.x)}" aria-label="內容"></div>`).join('')+`<button class="act" data-add="1">＋ 新增行程</button>`;
 }else{
  el.className='card'+(pop?' pop':'');
  el.innerHTML='<div class="tl">'+D.items.map(it=>`<div class="it${it.m?' must':''}"><div class="tm"><b>${esc(it.t)}</b> <span class="tag t-${it.g}">${esc(it.g)}</span>${it.m?'<span class="must-b">★ 必去</span>':''}</div><div>${esc(it.x)}</div></div>`).join('')+'</div>';
 }
}
function list(id,k){
 const a=S[k],n=a.filter(x=>x.c).length;
 $(id).innerHTML=`<div class="prog">已完成 ${n} / ${a.length}</div><div class="bar"><i style="width:${a.length?n/a.length*100:0}%"></i></div><ul class="ck">`+a.map((x,i)=>`<li class="${x.c?'done':''}"><input type="checkbox" data-k="${k}" data-i="${i}"${x.c?' checked':''} aria-label="${esc(x.t)}"><span class="lb">${esc(x.t)}</span>${S.edit?`<button class="act x" data-dk="${k}" data-di="${i}">✕</button>`:''}</li>`).join('')+`</ul>`+(S.edit?`<div class="add"><input placeholder="新增項目" data-new="${k}"><button class="act" data-ak="${k}">＋</button></div>`:'');
}
function all(pop){days();tl(pop);list('brands','brands');list('todos','todos');const f=$('fab');f.textContent=S.edit?'✓ 完成':'✎ 編輯';f.classList.toggle('on',S.edit)}

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-day],[data-del],[data-add],[data-dk],[data-ak]');if(!b)return;
 const d=b.dataset;
 if(d.day!==undefined){S.cur=+d.day;save();all(true);return}
 if(d.del!==undefined)S.days[S.cur].items.splice(+d.del,1);
 if(d.add)S.days[S.cur].items.push({t:'12:00',x:'新行程',g:'購物'});
 if(d.dk)S[d.dk].splice(+d.di,1);
 if(d.ak){const inp=document.querySelector(`[data-new="${d.ak}"]`);if(inp.value.trim())S[d.ak].push({t:inp.value.trim(),c:0})}
 save();all();
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.k){S[t.dataset.k][+t.dataset.i].c=t.checked?1:0;save();list('brands','brands');list('todos','todos')}
 else if(t.dataset.f==='tag'||t.dataset.f==='must'){const r=t.closest('[data-i]'),it=S.days[S.cur].items[+r.dataset.i];if(t.dataset.f==='tag')it.g=t.value;else it.m=t.checked?1:0;save()}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.f==='time'||t.dataset.f==='text'){const r=t.closest('[data-i]'),it=S.days[S.cur].items[+r.dataset.i];it[t.dataset.f==='time'?'t':'x']=t.value;save()}
});
$('fab').onclick=()=>{S.edit=!S.edit;save();all()};

function cd(){
 const ms=new Date('2026-12-08T06:55:00+08:00')-new Date();
 if(ms<=0){$('cd').textContent='旅程進行中 ✿';return}
 const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);
 $('cd').innerHTML=`<div><b>${d}</b><span>天</span></div><div><b>${h}</b><span>小時</span></div><div><b>${m}</b><span>分鐘</span></div>`;
}
cd();setInterval(cd,30000);
all();
</script>
</body>
</html>
